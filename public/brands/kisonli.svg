<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 65" width="260" height="65">
  <!-- Audio speaker symbol -->
  <g transform="translate(10, 12)">
    <!-- Speaker box -->
    <rect x="0" y="2" width="34" height="38" rx="6" fill="#1A1A1A"/>
    <!-- Speaker cone / sound ring -->
    <circle cx="17" cy="15" r="7" fill="#E51928"/>
    <circle cx="17" cy="15" r="3" fill="#FFFFFF"/>
    <circle cx="17" cy="29" r="5" fill="#333333"/>
  </g>
  <!-- Kisonli Wordmark -->
  <text x="56" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5" fill="#1A1A1A">Kisonli</text>
</svg>