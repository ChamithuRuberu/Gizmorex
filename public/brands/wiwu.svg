<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <!-- Hexagon i-icon -->
  <g transform="translate(12, 10)">
    <polygon points="20,0 38,10 38,32 20,42 2,32 2,10" fill="none" stroke="#0F2137" stroke-width="3"/>
    <rect x="18" y="11" width="4" height="4" fill="#E51928"/>
    <rect x="18" y="18" width="4" height="15" rx="1" fill="#0F2137"/>
  </g>
  <!-- WiWU Wordmark -->
  <g transform="translate(68, 50)">
    <!-- W -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#0F2137" letter-spacing="1">
      <tspan x="0" y="0">W</tspan>
      <tspan x="42" y="0">i</tspan>
      <tspan x="56" y="0">W</tspan>
      <tspan x="98" y="0">U</tspan>
    </text>
    <!-- Red square dot for 'i' -->
    <rect x="42.5" y="-39" width="7" height="7" fill="#E51928"/>
  </g>
</svg>