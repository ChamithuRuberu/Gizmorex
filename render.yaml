# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Secrets marked `sync: false` are typed into the Render dashboard, never committed.
services:
  - type: web
    name: gizmorex
    runtime: node
    region: singapore          # closest Render region to Sri Lanka
    plan: free                 # change to "starter" to stop the 15-minute sleep
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_APP_NAME
        value: Gizmorex
      - key: NEXT_PUBLIC_APP_URL      # e.g. https://gizmorex.onrender.com or your domain
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH      # paste as-is, no \ before $
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DIRECTPAY_MERCHANT_ID
        sync: false
      - key: DIRECTPAY_SECRET_KEY
        sync: false
      - key: DIRECTPAY_STAGE
        value: DEV
